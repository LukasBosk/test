<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivní mapa s OpenLayers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #map {
            width: 100vw; /* Celá šířka obrazovky */
            height: 100vh; /* Celá výška obrazovky */
        }
        .map-marker {
            width: 20px;
            height: 20px;
            background-color: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/ol@latest/ol.js"></script>
    <script>
        // Rozměry obrázku
        const imgWidth = 6116;  // Šířka obrázku v pixelech
        const imgHeight = 8159; // Výška obrázku v pixelech

        // Inicializace mapy
        const map = new ol.Map({
            target: 'map',
            view: new ol.View({
                center: [imgWidth / 2, -imgHeight / 2], // Střed obrázku
                zoom: 2, // Výchozí zoom
                maxZoom: 5,
                minZoom: 0,
                extent: [0, -imgHeight, imgWidth, 0] // Omezení pohybu
            }),
            layers: [
                new ol.layer.Image({
                    source: new ol.source.ImageStatic({
                        url: 'mapa.jpg', // Cesta k obrázku
                        imageExtent: [0, -imgHeight, imgWidth, 0], // Souřadnice obrázku
                    })
                })
            ]
        });

        // Přidání interaktivních bodů
        function addMarker(x, y, text) {
            const marker = document.createElement('div');
            marker.className = 'map-marker';
            marker.title = text;
            marker.style.left = `${(x / imgWidth) * 100}%`;
            marker.style.top = `${(-y / imgHeight) * 100}%`;

            marker.onclick = () => alert(`Klikli jste na: ${text}`);
            document.getElementById('map').appendChild(marker);
        }

        // Body relativní k obrázku
        addMarker(1663, -1868, 'Bod 1');
    </script>
</body>
</html>
