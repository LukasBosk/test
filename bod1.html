<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivní mapa</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Celá výška obrazovky */
            margin: 0;
            background-color: #f0f0f0; /* Volitelně barva pozadí */
        }
        img {
            max-width: 100vw; /* Obrázek se přizpůsobí šířce obrazovky */
            max-height: 100vh; /* Obrázek se přizpůsobí výšce obrazovky */
            width: auto; /* Zachová proporce */
            height: auto; /* Zachová proporce */
        }
    </style>
</head>
<body>
    <!-- Obrázek s propojením na mapu -->
    <img id="interactive-image" src="bod1.png" usemap="#bod1" alt="Interaktivní obrázek">

    <!-- Definice mapy a interaktivní oblasti -->
    <map name="bod1">
        <!-- Bod č. 1: Obdélník (originální souřadnice) -->
        <area id="area1" shape="rect" coords="2760,2002,3059,2127" href="test.html" alt="Bod 1" title="Více informací o bodu 1">
    </map>

    <script>
        // Originální rozměry obrázku
        const originalWidth = 3713; // Originální šířka obrázku
        const originalHeight = 2500; // Originální výška obrázku

        // Funkce pro přepočet souřadnic
        function scaleCoords(coords, scaleX, scaleY) {
            return coords.map((coord, index) => {
                return index % 2 === 0 ? Math.round(coord * scaleX) : Math.round(coord * scaleY);
            });
        }

        // Přepočet souřadnic při změně velikosti obrázku
        function updateAreaCoords() {
            const img = document.getElementById('interactive-image');
            const area = document.getElementById('area1');

            // Aktuální rozměry obrázku
            const currentWidth = img.clientWidth;
            const currentHeight = img.clientHeight;

            // Poměry škálování
            const scaleX = currentWidth / originalWidth;
            const scaleY = currentHeight / originalHeight;

            // Originální souřadnice
            const originalCoords = [2760, 2002, 3059, 2127];

            // Přepočítané souřadnice
            const scaledCoords = scaleCoords(originalCoords, scaleX, scaleY);

            // Nastavení nových souřadnic
            area.coords = scaledCoords.join(',');
        }

        // Spuštění přepočtu při načtení stránky a při změně velikosti okna
        window.onload = updateAreaCoords;
        window.onresize = updateAreaCoords;
    </script>
</body>
</html>
